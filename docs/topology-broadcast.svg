<svg xmlns="http://www.w3.org/2000/svg" width="700" height="230" viewBox="0 0 700 230" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- producer (right edge x=190) -->
  <rect x="20"  y="90" width="170" height="50" rx="8" fill="#2563eb"/>
  <text x="105" y="120" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">producer</text>

  <!-- N consumers (left edge x=510) -->
  <rect x="510" y="20"  width="170" height="50" rx="8" fill="#f97316"/>
  <text x="595" y="50" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">consumer 0</text>
  <rect x="510" y="90"  width="170" height="50" rx="8" fill="#f97316"/>
  <text x="595" y="120" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">consumer 1</text>
  <rect x="510" y="160" width="170" height="50" rx="8" fill="#f97316"/>
  <text x="595" y="190" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">consumer N-1</text>

  <!-- short probe line inserted into each consumer entry point -->
  <line x1="190" y1="115" x2="480" y2="115" stroke="#64748b" stroke-width="2.5"/>
  <line x1="480" y1="115" x2="480" y2="45"  stroke="#64748b" stroke-width="2.5"/>
  <line x1="480" y1="45"  x2="510" y2="45"  stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="115" x2="510" y2="115" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="185" x2="510" y2="185" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="115" x2="480" y2="185" stroke="#64748b" stroke-width="2.5"/>

  <!-- shared file-stream label, in whitespace clear of lines -->
  <text x="310" y="90"  fill="#475569" font-size="13" text-anchor="middle" font-style="italic">same files</text>
  <text x="310" y="140" fill="#94a3b8" font-size="11" text-anchor="middle">file_%d.dat</text>
</svg>