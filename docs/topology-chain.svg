<svg xmlns="http://www.w3.org/2000/svg" width="620" height="150" viewBox="0 0 620 150" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- producer -->
  <rect x="20"  y="50" width="170" height="50" rx="8" fill="#2563eb"/>
  <text x="105" y="79" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">producer</text>

  <!-- consumer -->
  <rect x="430" y="50" width="170" height="50" rx="8" fill="#f97316"/>
  <text x="515" y="79" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">consumer</text>

  <!-- arrow + file stream -->
  <line x1="190" y1="75" x2="430" y2="75" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="310" y="45" fill="#475569" font-size="13" text-anchor="middle" font-style="italic">file_%d.dat</text>
  <text x="310" y="110" fill="#94a3b8" font-size="11" text-anchor="middle">(OUTPUT_FILE_FORMAT)</text>
</svg>