<svg xmlns="http://www.w3.org/2000/svg" width="820" height="240" viewBox="0 0 820 240" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- producer (right edge x=165) -->
  <rect x="15"  y="95" width="150" height="50" rx="8" fill="#2563eb"/>
  <text x="90"  y="125" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">producer</text>

  <!-- N prodcons (left edge x=330, right edge x=490) -->
  <rect x="330" y="15"  width="160" height="50" rx="8" fill="#16a34a"/>
  <text x="410" y="45" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">prodcons 0</text>
  <rect x="330" y="95"  width="160" height="50" rx="8" fill="#16a34a"/>
  <text x="410" y="125" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">prodcons 1</text>
  <rect x="330" y="175" width="160" height="50" rx="8" fill="#16a34a"/>
  <text x="410" y="205" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">prodcons N-1</text>

  <!-- single consumer (left edge x=650) -->
  <rect x="650" y="95" width="150" height="50" rx="8" fill="#f97316"/>
  <text x="725" y="125" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">consumer</text>

  <!-- fan-out: producer -> branch point x=295 -> N prodcons (left edge of prodcons) -->
  <line x1="165" y1="120" x2="295" y2="120" stroke="#64748b" stroke-width="2.5"/>
  <line x1="295" y1="120" x2="295" y2="40"  stroke="#64748b" stroke-width="2.5"/>
  <line x1="295" y1="40"  x2="330" y2="40"  stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="295" y1="120" x2="330" y2="120" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="295" y1="200" x2="330" y2="200" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="295" y1="120" x2="295" y2="200" stroke="#64748b" stroke-width="2.5"/>
  <text x="235" y="85" fill="#475569" font-size="13" text-anchor="middle" font-style="italic">p0_%d.dat</text>

  <!-- fan-in: N prodcons (right edge x=490) -> branch point x=570 -> consumer (left edge x=650) -->
  <line x1="490" y1="40"  x2="570" y2="40"  stroke="#64748b" stroke-width="2.5"/>
  <line x1="490" y1="120" x2="570" y2="120" stroke="#64748b" stroke-width="2.5"/>
  <line x1="490" y1="200" x2="570" y2="200" stroke="#64748b" stroke-width="2.5"/>
  <line x1="570" y1="40"  x2="570" y2="120" stroke="#64748b" stroke-width="2.5"/>
  <line x1="570" y1="200" x2="570" y2="120" stroke="#64748b" stroke-width="2.5"/>
  <line x1="570" y1="120" x2="650" y2="120" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="522" y="165" fill="#475569" font-size="13" text-anchor="middle" font-style="italic">mid_&lt;k&gt;_%d.dat</text>
  <text x="626" y="142" fill="#475569" font-size="13" text-anchor="middle" font-style="italic">mid_%d_%d.dat</text>
</svg>